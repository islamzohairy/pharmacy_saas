# P0 gate (PLANS/08 step 1): analyze + full test suite + release APK build.
# Release builds use the template's debug-signing fallback (build.gradle.kts)
# — no signing secrets are ever needed in CI; signed pilot builds are produced
# locally via gitignored key.properties (see SUPPORT_AND_ROLLBACK.md runbook).
name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 60s
      - run: flutter build apk --release
