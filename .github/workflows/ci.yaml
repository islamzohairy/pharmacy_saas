# Pilot release gate (PLANS/08 step 1, hardened 2026-08-15): analyze +
# full test suite + release APK validation build on every push/PR.
#
# ENV DEFINES ARE REQUIRED, NOT OPTIONAL: the app reads SUPABASE_URL and
# SUPABASE_ANON_KEY from dart-defines (lib/core/config/app_config.dart); a
# release build without them compiles fine but sync silently never runs
# (Plan 13 lesson). .env.local is reconstructed from repository secrets at
# workflow time and the build HARD-FAILS when any required define is
# missing — a silently unconfigured build cannot pass this gate.
#
# Signing stays template-debug-fallback in CI (no signing secrets ever in
# CI — build.gradle.kts keys release signing off a local, gitignored
# android/key.properties). The keystore-signed pilot build is produced
# locally per SUPPORT_AND_ROLLBACK.md §3/§6 and never built from CI.
name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 60s
      - name: Reconstruct .env.local from repo secrets (hard-fail if missing)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          : "${SUPABASE_URL:?secrets.SUPABASE_URL is missing — set it in repo settings; a release build without env defines is a silently unconfigured build (Plan 13 lesson)}"
          : "${SUPABASE_ANON_KEY:?secrets.SUPABASE_ANON_KEY is missing — set it in repo settings; a release build without env defines is a silently unconfigured build (Plan 13 lesson)}"
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.local
      - run: flutter build apk --release --dart-define-from-file=.env.local