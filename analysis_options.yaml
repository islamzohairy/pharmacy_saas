# Analyzer configuration. Extends flutter_lints with explicit additions
# per CORE_SYSTEM/GLOBAL_RULES.md — strictest reasonable lint set,
# zero analyzer warnings at merge time.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated code (drift). Checked in for deterministic builds, but not
    # linted — drift emits its own ignore directives.
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - unnecessary_lambdas
    - unawaited_futures
    - use_super_parameters
    - directives_ordering
